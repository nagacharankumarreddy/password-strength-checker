<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <title>Password Crack Time</title>
    <link rel="icon" href="./bug.gif" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
  </head>

  <body>
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>

    <main class="card">
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="10.5" width="16" height="10" rx="2.5" />
          <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" />
          <circle cx="12" cy="15.5" r="1.2" fill="currentColor" stroke="none" />
        </svg>
      </div>
      <h1>Password Crack Time</h1>
      <p class="lead">See how long a brute-force attack would take to break your password. Nothing you type leaves this page.</p>

      <label class="field" for="pword">
        <span class="sr-only">Password</span>
        <input id="pword" type="password" placeholder="Type a password" autocomplete="off" spellcheck="false" />
        <button type="button" class="toggle" id="toggle" aria-label="Show password" aria-pressed="false">
          <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" />
            <circle cx="12" cy="12" r="3" />
            <path class="slash" d="M4 4l16 16" />
          </svg>
        </button>
      </label>

      <div class="meter" aria-live="polite">
        <div class="meter-head">
          <span class="meter-label">Strength</span>
          <span class="meter-value" id="status-text">Type a password</span>
        </div>
        <div class="segments" id="segments" role="progressbar" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0">
          <i></i><i></i><i></i><i></i><i></i>
        </div>
      </div>

      <ul class="checks" id="checks">
        <li data-check="length">8+ characters</li>
        <li data-check="lower">a–z</li>
        <li data-check="upper">A–Z</li>
        <li data-check="number">0–9</li>
        <li data-check="symbol">Symbol</li>
      </ul>

      <button class="submit" id="submit" type="button">Check</button>

      <section class="result" id="res" aria-live="polite" hidden>
        <p class="result-label">Estimated time to crack</p>
        <p class="result-value" id="res-value"></p>
        <p class="result-note" id="res-note"></p>
      </section>
    </main>
  </body>
</html>
